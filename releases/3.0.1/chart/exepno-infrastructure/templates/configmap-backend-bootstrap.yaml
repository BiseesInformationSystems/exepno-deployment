{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": {{ printf "%s-backend-bootstrap" .Release.Name | toJson }},
    "namespace": {{ .Release.Namespace | toJson }},
    "labels": {
      "app.kubernetes.io/name": {{ .Release.Name | toJson }},
      "app.kubernetes.io/instance": {{ .Release.Name | toJson }},
      "app.kubernetes.io/part-of": "exepno-performance",
      "app.kubernetes.io/managed-by": {{ .Release.Service | toJson }}
    }
  },
  "data": {
    "start.py": "import os\nimport sys\nsys.path.insert(0, \"/app\")\nfrom scripts.provider_secrets import get_required_secret\n\nfor key in (\"OPENAI_API_KEY\", \"GEMINI_API_KEY\"):\n    os.environ[key] = get_required_secret(key)\n\nimport uvicorn\nuvicorn.run(\"api:app\", host=\"0.0.0.0\", port=8000, workers=1)\n"
  }
}
