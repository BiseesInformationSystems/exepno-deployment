{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": {{ printf "%s-gateway" .Release.Name | toJson }},
    "namespace": {{ .Release.Namespace | toJson }},
    "labels": {
      "app.kubernetes.io/name": {{ .Release.Name | toJson }},
      "app.kubernetes.io/instance": {{ .Release.Name | toJson }},
      "app.kubernetes.io/part-of": "exepno-performance",
      "app.kubernetes.io/managed-by": {{ .Release.Service | toJson }}
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "gateway",
        "app.kubernetes.io/instance": {{ .Release.Name | toJson }}
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "gateway",
          "app.kubernetes.io/name": {{ .Release.Name | toJson }},
          "app.kubernetes.io/instance": {{ .Release.Name | toJson }}
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "gateway",
            "image": {{ index .Values "components" "gateway" "image" | toJson }},
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "resources": {{ index .Values "components" "gateway" "resources" | toJson }},
            "command": [
              "nginx",
              "-c",
              "/config/nginx.conf",
              "-g",
              "daemon off;"
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/config",
                "readOnly": true
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "readinessProbe": {
              "httpGet": {
                "port": 8080,
                "path": "/login"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 6
            }
          }
        ],
        "terminationGracePeriodSeconds": 60,
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": {{ printf "%s-gateway-config" .Release.Name | toJson }}
            }
          },
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ],
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 101,
          "runAsGroup": 101,
          "fsGroup": 101
        }
      }
    }
  }
}
